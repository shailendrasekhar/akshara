[project]
name = "akshara"
version = "0.2.0"
description = "A focused Linux PDF reader with neural text-to-speech, Pomodoro timer and reading analytics"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Shailendra Sekhar Bathula" }]
keywords = ["pdf", "reader", "tts", "text-to-speech", "pomodoro"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
]
dependencies = [
    "PyQt6>=6.6",
    "PyMuPDF>=1.24",
]

[project.optional-dependencies]
# Neural text-to-speech. Heavy (pulls in PyTorch), so it is optional:
# the reader works without it and shows a hint in the UI.
tts = [
    "kokoro>=0.9.4",
    "numpy>=1.24",
    "sounddevice>=0.4.6",
]

[project.scripts]
akshara = "akshara.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "numpy>=1.24",  # exercised by the TTS engine tests with a fake pipeline
]
build = [
    "pyinstaller>=6.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/akshara"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # typographic unicode (×, –, …) is intentional in UI text
    "E501",                        # long stylesheet/f-string lines are fine; formatter handles code
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
packages = ["akshara"]
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
# PyQt6 stubs type nearly every getter (menuBar(), viewport(), ...) and every
# event-handler argument as Optional, which drowns real findings in noise.
disable_error_code = ["union-attr", "override"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyqt6"
addopts = "-ra"

[tool.coverage.run]
source = ["akshara"]
branch = true
