# Flatpak manifest for Akshara.
#
#   flatpak install flathub org.kde.Sdk//6.9 com.riverbankcomputing.PyQt.BaseApp//6.9
#   flatpak-builder --user --install --force-clean build-dir \
#       packaging/flatpak/io.github.shailendrasekhar.Akshara.yml
#   flatpak run io.github.shailendrasekhar.Akshara
#
# The sandboxed build ships the reader with system speech (speech-dispatcher).
# Neural voices are installed from inside the app (Preferences ▸ Read aloud ▸
# Install neural voices…) into ~/.var/app/<id>/data, which is why the app
# needs network access.
id: io.github.shailendrasekhar.Akshara
runtime: org.kde.Platform
runtime-version: '6.9'
sdk: org.kde.Sdk
base: com.riverbankcomputing.PyQt.BaseApp
base-version: '6.9'
command: akshara

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  # Neural-voice add-on install and first-run model download (Hugging Face).
  - --share=network
  # Library entries reopen books by path; read-only is enough.
  - --filesystem=home:ro
  # System speech fallback.
  - --filesystem=xdg-run/speech-dispatcher:ro
  # Pomodoro phase notifications.
  - --talk-name=org.freedesktop.Notifications

cleanup-commands:
  - /app/cleanup-BaseApp.sh

modules:
  # Audio output library used by the neural voices (python-sounddevice).
  - name: portaudio
    buildsystem: autotools
    config-opts:
      - --without-jack
      - --without-oss
    cleanup:
      - /include
      - /lib/pkgconfig
      - '*.la'
      - '*.a'
    sources:
      - type: archive
        url: http://files.portaudio.com/archives/pa_stable_v190700_20210406.tgz
        sha256: 47efbf42c77c19a05d22e627d42873e991ec0c1357219c0d74ce6a2948cb2def

  # Generated by generate_python_deps.py from uv.lock.
  - python3-deps.json

  - name: akshara
    buildsystem: simple
    build-commands:
      - pip3 install --no-deps --no-index --no-build-isolation --prefix=${FLATPAK_DEST} .
      - install -Dm644 packaging/linux/${FLATPAK_ID}.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 packaging/linux/${FLATPAK_ID}.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - |
        cd packaging/linux/icons
        find hicolor -name "${FLATPAK_ID}.png" -exec install -Dm644 {} ${FLATPAK_DEST}/share/icons/{} \;
    sources:
      - type: dir
        path: ../..
        skip:
          - .venv
          - build
          - dist
          - .flatpak-builder
